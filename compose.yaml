name: kredita-revisao

x-app: &app
  build: .
  image: kredita-revisao:local
  environment:
    DATABASE_URL: /app/data/kredita.db
  volumes:
    - data:/app/data

services:
  carga:
    <<: *app
    command: ["python", "importar_kredita.py"]

  web:
    <<: *app
    depends_on:
      carga:
        condition: service_completed_successfully
    ports:
      - "${KREDITA_HTTP_BIND:-0.0.0.0}:${KREDITA_HTTP_PORT:-8788}:8080"
    restart: unless-stopped

volumes:
  data:
