<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kredita - Estrutura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <header class="bg-dark text-white py-3">
    <div class="container-fluid d-flex align-items-center gap-1">
        <img src="imagens/logo.png" alt="Logo Kredita" width="60" height="40" class="img-fluid">
        <h1 style="font-family: 'Black Ops One' , cursive">Kredita</h1>
        
    </div>
</header>

    <nav class="navbar navbar-expand-md navbar-dark bg-secondary">
        <div class="container-fluid">
                <ul class="navbar-nav gap-2">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Quem Somos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Contatos</a>
                    </li>
                </ul>   
        </div>
    </nav>

    <div class="container-fluid flex-grow-1 d-flex flex-column my-3">
        <div class="row g-3 flex-grow-1 align-items-stretch">
            
            <aside class="col-12 col-md-3 col-lg-2">
                <div class="card h-100 shadow-sm border-0 p-3 bg-white">
                    <h3 class="h5 border-bottom pb-2">Lateral (aside)</h3>
                    <div class="d-flex flex-column gap-2 mt-2">
                        <p>Gráfico X</p>
                        <p>Detalhes Y</p>
                    </div>
                </div>
            </aside>

            <main class="col-12 col-md-9 col-lg-10">
                <div class="card h-100 p-4 bg-white">
                    <h2>(Main)</h2>
                    <p class="text-muted">(descrição do main)</p>

                    <div class="row g-3 mt-4">
                        <div class="col-md-4">
                            <div class="p-3 border bg-light text-center text-muted">
                                [ Painel de Dados / Gráfico ]
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border bg-light text-center text-muted">
                                [ Tabela / Lista de Itens ]
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="p-3 border bg-light text-center text-muted">
                                [ Ações / Detalhes ]
                            </div>
                        </div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="m-0 text-white-50">(footer)</p>
    </footer>
